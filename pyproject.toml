[project]
name = "tally"
version = "0.1.0"
description = "Tally: a hands-free agent for home child care providers. Built with Strands Agents and Amazon Bedrock AgentCore."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    # The rulebook server targets the FastMCP API from mcp 1.x. mcp 2.0 renamed it to
    # MCPServer and changed other surfaces with it. strands-agents allows both majors, so
    # an unpinned install silently picked 2.x in CI and not locally, and the same clone
    # gave two different results. Pinned to the major this code is written and tested
    # against, so a fresh clone reproduces the demo.
    "mcp>=1.23,<2",
    "bedrock-agentcore",
    "pydantic>=2",
    "pyyaml",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repository root on the path so `evals` imports under a bare `pytest`.
# CI runs `pytest`; a local `python -m pytest` adds the working directory itself, which
# is why this was green locally and red on every push.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # The clock is simulated and every timestamp in this project is local wall time on purpose, so
    # a timezone-aware datetime would be a lie about precision this domain does not have.
    "DTZ",
    # Around AWS and a peer agent, a broad except is the point: the fallback path exists so that a
    # managed service having a bad minute degrades rather than takes the product down.
    "BLE001",
    "B008",  # FastAPI dependencies are function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# A prompt and a table of synthetic data read better as one line each than wrapped mid sentence.
"src/*/agents/prompts.py" = ["E501"]
"src/*/data/generate.py" = ["E501"]
"src/*/messaging.py" = ["E501"]
# Narration lines and title-card HTML are sentences; wrapping them mid sentence helps nobody.
"tools/make_video.py" = ["E501"]
